name: Archive fixture smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/archive-fixture-smoke.yml"
      - "src/**"
      - "test/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: archive-fixture-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-fixture-smoke:
    name: Verify raw archive round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Exercise the complete archive test suite
        run: node --experimental-strip-types --test
