name: Archive collection plan

on:
  workflow_dispatch:
    inputs:
      list_id:
        description: Twitter list ID used only to validate request construction
        required: true
        type: string
      request_catalog_revision:
        description: 40-character commit SHA for upstream requests.ndjson
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: archive-collection-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Verify Tailscale and build a Relay request plan
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: archive-collection
    timeout-minutes: 10
    steps:
      - name: Check out trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Join the existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: tw.home.yutakobayashi.com

      - name: Download the immutable request catalog revision
        env:
          CATALOG_REVISION: ${{ inputs.request_catalog_revision }}
        run: |
          set -euo pipefail
          if [[ ! "$CATALOG_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "request_catalog_revision must be a 40-character commit SHA" >&2
            exit 2
          fi
          curl --fail --silent --show-error \
            --output "$RUNNER_TEMP/requests.ndjson" \
            "https://raw.githubusercontent.com/fa0311/twitter_api_safe_relay_skills/$CATALOG_REVISION/skills/twitter-api-relay/requests.ndjson"

      - name: Build the sanitized timeline plan without executing it
        env:
          CATALOG_REVISION: ${{ inputs.request_catalog_revision }}
          LIST_ID: ${{ inputs.list_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types src/cli.ts plan-timeline \
            --request-catalog "$RUNNER_TEMP/requests.ndjson" \
            --revision "$CATALOG_REVISION" \
            --profile account2 \
            --list-id "$LIST_ID" \
            --json
