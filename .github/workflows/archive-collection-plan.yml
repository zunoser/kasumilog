name: Archive collection plan

on:
  workflow_dispatch:

env:
  REQUEST_CATALOG_REVISION: a4d8b5f92874f593272e3c61427c61754cde6103
  REQUEST_CATALOG_SHA256: 683a5951263e501ae02b8f6244ff0660d6b641cc0be9845741cb785881391311

permissions:
  contents: read

concurrency:
  group: archive-collection-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Build a Relay request plan without private network access
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the immutable request catalog revision
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --output "$RUNNER_TEMP/requests.ndjson" \
            "https://raw.githubusercontent.com/fa0311/twitter_api_safe_relay_skills/$REQUEST_CATALOG_REVISION/skills/twitter-api-relay/requests.ndjson"
          printf '%s  %s\n' "$REQUEST_CATALOG_SHA256" "$RUNNER_TEMP/requests.ndjson" \
            | sha256sum --check --strict

      - name: Build the sanitized timeline plan without executing it
        env:
          LIST_ID: ${{ vars.TWITTER_ARCHIVE_LIST_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$LIST_ID" ]]; then
            echo "TWITTER_ARCHIVE_LIST_ID is not configured" >&2
            exit 2
          fi
          node --experimental-strip-types src/cli.ts plan-timeline \
            --request-catalog "$RUNNER_TEMP/requests.ndjson" \
            --revision "$REQUEST_CATALOG_REVISION" \
            --profile account2 \
            --list-id "$LIST_ID" \
            --json
